[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "shea"
description = "Shawn Hartsock's Experimental Agent — a Python host over newt-agent and newtui, built from main"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Shawn Hartsock", email = "hartsock@users.noreply.github.com" }]
dynamic = ["version"]
# Python-level deps, from source (git main), never a shelf release. The
# content-addressable binding builds via maturin at install time (needs Rust).
dependencies = [
    "content-addressable @ git+https://github.com/hartsock/content-addressable@main",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff", "black", "maturin>=1.7,<2.0"]

[project.scripts]
shea = "shea.brand:main"

[tool.maturin]
python-source = "python"
module-name = "shea._native"
bindings = "pyo3"
features = ["pyo3/extension-module"]

[tool.black]
# Explicit for the same reason as the ruff rules below: black otherwise infers
# a target from the environment and warns (or reformats) differently per
# version. Matches requires-python.
target-version = ["py310"]

[tool.ruff.lint]
# Explicit, because ruff's DEFAULT rule set drifts between releases: 0.15 and
# 0.16 disagreed about this very tree, so `just check` passed locally and CI
# failed. Naming the rules makes the gate reproducible across versions.
# E4/E7/E9 + F is ruff's own default (E501 left to black); I = import order,
# UP = modern syntax, B = bugbear, PLW = pylint warnings.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "PLW"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `maturin develop` drops the compiled `_native` into python/shea/, so tests
# run from the tree without a pip install.
pythonpath = ["python"]
